<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사진 불꽃놀이 | LIEN</title>
<style>
:root{--bg:#05060a;--ink:#f1f2f6;--mute:#9aa0b4;--acc:#ff8a5c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,"Malgun Gothic",sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.85))}
button,label.b{font:inherit;font-weight:700;padding:12px 16px;border-radius:999px;border:1px solid #333;background:#15171f;color:var(--ink);cursor:pointer}
label.b{background:var(--acc);border-color:var(--acc);color:#111}
.top{position:fixed;top:0;left:0;right:0;padding:14px 16px;text-align:center;color:var(--mute);font-size:14px}
.top b{color:var(--ink);font-size:17px;display:block}
input[type=range]{width:120px}
</style></head><body>
<canvas id="c"></canvas>
<div class="top"><b>사진 불꽃놀이</b>사진을 여러 장 고르면 불꽃이 터져 그 사진이 되고, 다음 사진으로 바뀌어요</div>
<div class="bar">
 <label class="b">사진 넣기<input id="f" type="file" accept="image/*" multiple hidden></label>
 <button id="again">다시 터뜨리기</button>
 <label class="b" style="background:#15171f;color:var(--ink);border-color:#333">촘촘함 <input id="gap" type="range" min="2" max="8" value="4"></label>
</div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');let Wd,Ht,dpr;
function size(){dpr=Math.min(2,devicePixelRatio||1);Wd=innerWidth;Ht=innerHeight;cv.width=Wd*dpr;cv.height=Ht*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
let imgs=[],targets=[],P=[],stage=0,t0=0,N=0;
function sample(img,gap){
 const s=Math.min(Wd*.92/img.width,Ht*.72/img.height),w=Math.round(img.width*s),h=Math.round(img.height*s);
 const o=document.createElement('canvas');o.width=w;o.height=h;const g=o.getContext('2d');g.drawImage(img,0,0,w,h);
 const d=g.getImageData(0,0,w,h).data,ox=(Wd-w)/2,oy=(Ht-h)/2-20,pts=[];
 // 바깥 테두리와 이어진 바탕만 지운다 (안쪽 흰색은 남김)
 const bg=new Uint8Array(w*h),q=[],c0=[d[0],d[1],d[2]];
 const near=i=>Math.abs(d[i*4]-c0[0])+Math.abs(d[i*4+1]-c0[1])+Math.abs(d[i*4+2]-c0[2])<40;
 for(let i=0;i<w;i++){q.push(i,(h-1)*w+i)}for(let j=0;j<h;j++){q.push(j*w,j*w+w-1)}
 while(q.length){const i=q.pop();if(bg[i]||!near(i))continue;bg[i]=1;const a=i%w,b=(i/w)|0;if(a>0)q.push(i-1);if(a<w-1)q.push(i+1);if(b>0)q.push(i-w);if(b<h-1)q.push(i+w)}
 for(let j=0;j<h;j+=gap)for(let i=0;i<w;i+=gap){const k=j*w+i;if(bg[k]||d[k*4+3]<40)continue;pts.push([ox+i,oy+j,d[k*4],d[k*4+1],d[k*4+2]])}
 return pts;
}
function build(){
 const gap=+document.getElementById('gap').value;targets=imgs.map(im=>sample(im,gap));
 N=Math.max(...targets.map(t=>t.length));
 targets=targets.map(t=>{const r=[];for(let i=0;i<N;i++)r.push(t[(i*7919)%t.length]);return r});
 P=[];for(let i=0;i<N;i++){const a=Math.random()*6.283,s=(80+Math.random()*420);P.push({x:Wd/2,y:Ht*.42,vx:Math.cos(a)*s,vy:Math.sin(a)*s,d:Math.random()*.35,sx:(Math.random()-.5)*260,sy:(Math.random()-.5)*260})}
 stage=0;t0=performance.now();
}
const ss=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const HOLD=3.2;
function frame(now){
 requestAnimationFrame(frame);x.globalCompositeOperation='source-over';x.fillStyle='rgba(5,6,10,.35)';x.fillRect(0,0,Wd,Ht);
 if(!N){demo(now);return}
 let t=(now-t0)/1000;const rise=.8;x.globalCompositeOperation='lighter';
 if(t<rise){const y=Ht-40-(Ht-40-Ht*.42)*ss(t/rise);x.fillStyle='#ffd9a0';for(let i=0;i<30;i++)x.fillRect(Wd/2+(Math.random()-.5)*3,y+i*4,2,2);return}
 t-=rise;const per=HOLD+1.4;const k=Math.min(Math.floor(t/per),targets.length-1),u=t-k*per;
 if(k===targets.length-1&&u>per+2){}
 const T=targets[k],F=k?targets[k-1]:null;
 for(let i=0;i<N;i++){const p=P[i],g=T[i];let px,py,r,gg,b;
  if(!F){const e=Math.max(0,u-p.d),bx=Wd/2+p.vx*(1-Math.exp(-2.6*e))/2.6,by=Ht*.42+p.vy*(1-Math.exp(-2.6*e))/2.6+30*e*e,m=ss((u-.5-p.d)/1.3);
   px=bx*(1-m)+g[0]*m;py=by*(1-m)+g[1]*m;r=255*(1-m)+g[2]*m;gg=170*(1-m)+g[3]*m;b=90*(1-m)+g[4]*m}
  else{const f=F[i],m=ss((u-p.d)/1.5),mx=(f[0]+g[0])/2+p.sx,my=(f[1]+g[1])/2+p.sy;
   px=(1-m)*(1-m)*f[0]+2*(1-m)*m*mx+m*m*g[0];py=(1-m)*(1-m)*f[1]+2*(1-m)*m*my+m*m*g[1];r=f[2]*(1-m)+g[2]*m;gg=f[3]*(1-m)+g[3]*m;b=f[4]*(1-m)+g[4]*m}
  x.fillStyle=`rgb(${r|0},${gg|0},${b|0})`;x.fillRect(px,py,1.8,1.8)}
}
function demo(now){x.globalCompositeOperation='lighter';const t=now/1000;for(let i=0;i<220;i++){const a=i*2.4+t*.3,r=(t*90+i*7)%(Math.min(Wd,Ht)*.45);x.fillStyle=`hsl(${(i*13+t*40)%360} 90% 65%)`;x.fillRect(Wd/2+Math.cos(a)*r,Ht*.42+Math.sin(a)*r,2,2)}}
requestAnimationFrame(frame);
document.getElementById('f').onchange=async e=>{imgs=[];for(const file of e.target.files){const im=new Image();im.src=URL.createObjectURL(file);await im.decode();imgs.push(im)}if(imgs.length)build()};
document.getElementById('again').onclick=()=>imgs.length&&build();
document.getElementById('gap').onchange=()=>imgs.length&&build();
</script></body></html>
